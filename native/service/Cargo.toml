[package]
name = "drake-speech-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "=1.0.100"
cpal = "=0.15.3"
dirs = "=6.0.0"
hex = "=0.4.3"
interprocess = "=2.4.3"
parakeet-rs = { git = "https://github.com/altunenes/parakeet-rs", rev = "1d6ffeae1b8641f497e4ef9a5e9fff37aa7a4181", default-features = false, features = ["cpu", "ort-defaults", "api-28"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
widestring = "=1.2.1"

[profile.release]
lto = "thin"
strip = true
